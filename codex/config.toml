#:schema https://developers.openai.com/codex/config-schema.json

personality = "pragmatic"
model = "gpt-5.6-sol"
plan_mode_reasoning_effort = "xhigh"

sandbox_mode = "workspace-write"
approval_policy = "on-request"
default_permissions = "workspace_sandbox"
approvals_reviewer = "auto_review"
analytics.enabled = false
service_tier = "default"

[permissions.workspace_sandbox.filesystem.":workspace_roots"]
"." = "read"
"./**" = "write"
".git" = "write"

[permissions.workspace_sandbox.network]
enabled = true
mode = "full"

# Agent-safe keys flow in from ~/.agents/secrets.env. Shell wrappers keep
# sensitive keys from ~/.secrets.env out of agent environments.
[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true
exclude = ["*_PASSWORD", "AWS_*"]

[agents]
max_threads = 10

[features]
hooks = true
default_mode_request_user_input = true
terminal_resize_reflow = true
goals = true
js_repl = false

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "uv run ~/.agents/hooks/prevent-rm.py"
timeout = 30
statusMessage = "Checking for rm"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "uv run ~/.agents/hooks/timestamp.py"
timeout = 10
statusMessage = "Stamping time"

# Hook trust: Codex skips hooks until their hash is trusted (normally via /hooks
# in the TUI). Hashes cover the normalized hook config, not the machine, but the
# key embeds the layer path, so each hook needs a key per $HOME layout. Recompute
# after editing a hook: `codex app-server` RPC `hooks/list` reports currentHash.
[hooks.state."/home/akelly/.codex/config.toml:pre_tool_use:0:0"]
trusted_hash = "sha256:b840e4cee5b87e51cdf7a73f73284f671208fe5aaaf0942207abaab7f7e9a289"

[hooks.state."/Users/akelly/.codex/config.toml:pre_tool_use:0:0"]
trusted_hash = "sha256:b840e4cee5b87e51cdf7a73f73284f671208fe5aaaf0942207abaab7f7e9a289"

[hooks.state."/home/akelly/.codex/config.toml:user_prompt_submit:0:0"]
trusted_hash = "sha256:304f1d566a912c02e986c1a7741e5d4dde51edd599ef53b09152d937839a8e22"

[hooks.state."/Users/akelly/.codex/config.toml:user_prompt_submit:0:0"]
trusted_hash = "sha256:304f1d566a912c02e986c1a7741e5d4dde51edd599ef53b09152d937839a8e22"
