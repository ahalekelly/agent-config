#:schema https://developers.openai.com/codex/config-schema.json

personality = "pragmatic"
model = "gpt-5.6-sol"
model_instructions_file = "~/.agents/codex/model-instructions.md"
plan_mode_reasoning_effort = "xhigh"

approval_policy = "on-request"
default_permissions = "workspace_sandbox"
approvals_reviewer = "auto_review"
analytics.enabled = false
service_tier = "default"

[permissions.workspace_sandbox.filesystem]
"~/.ssh" = "deny"
"~/.gnupg" = "deny"
"~/.aws" = "deny"
"~/.pgpass" = "deny"
"~/.npmrc" = "deny"
"~/.git-credentials" = "deny"
"~/.docker" = "deny"
"~/.config/gh" = "deny"
"~/.secrets.env" = "deny"
"~/.agents/claude-token.env" = "deny"
"~/.agents/claudew-token.env" = "deny"
"~/.claude.json" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.codex/auth.json" = "deny"
"~/.pi/agent/auth.json" = "deny"

[permissions.workspace_sandbox.filesystem.":workspace_roots"]
"." = "read"
"./**" = "write"
".git" = "write"

[permissions.workspace_sandbox.network]
enabled = true
mode = "full"

# Agent-safe keys flow in from ~/.agents/secrets.env. Shell wrappers keep
# sensitive keys from ~/.secrets.env out of agent environments.
[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true
exclude = ["*_PASSWORD", "AWS_*"]

[agents]
max_threads = 10

[features]
hooks = true
default_mode_request_user_input = true
terminal_resize_reflow = true
goals = true
js_repl = false

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "uv run ~/.agents/hooks/prevent-rm.py"
timeout = 30
statusMessage = "Checking for rm"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "uv run ~/.agents/hooks/timestamp.py"
timeout = 10
statusMessage = "Stamping time"
